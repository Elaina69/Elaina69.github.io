<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/assets/images/logo.webp" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Elaina Da Catto</title>

        <!-- Styles -->
        <link rel="stylesheet" href="assets/styles/main.css">
        <link rel="stylesheet" href="assets/styles/overview.css">
        <link rel="stylesheet" href="assets/styles/myProjects.css">
        <link rel="stylesheet" href="assets/styles/contactMe.css">
        <link rel="stylesheet" href="assets/styles/slider.css">
        <link rel="stylesheet" href="assets/styles/fonts.css">
        <link rel="stylesheet" href="assets/styles/bubble.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="nav-content">
                <button class="nav-btn active" data-section="overview">Overview</button>
                <button class="nav-btn" data-section="mystuff">My Projects</button>
                <button class="nav-btn" data-section="contact">Contact Me</button>
            </div>
        </nav>

        <div class="portfolio-container">
            <!-- Overview section -->
            <div class="content-left" id="overview-section">
                <div class="profile-section">
                    <h1 class="name" id="toggle-avatar">Elaina Da Catto</h1>
                    <div class="github-avatar-container">
                        <img src="https://github.com/Elaina69.png" alt="GitHub Avatar" class="github-avatar" id="githubAvatar">
                    </div>
                    <p class="title">Cutie Web developer & AI Students ≽^- ˕ -^≼</p>
                    <p class="bio">I'm just a cat. Nyan ~~~</p>
                </div>

                <div class="skills-section">
                    <h2>Skills</h2>
                    <div class="skills-grid">
                        <span class="skill-tag">HTML/CSS</span>
                        <span class="skill-tag">JavaScript</span>
                        <span class="skill-tag">Python</span>
                        <span class="skill-tag" id="purr">Purr</span>
                    </div>
                </div>
            </div>

            <!-- My Projects section -->
            <div class="content-left" id="mystuff-section" style="display: none;">
                <h1 class="section-title" style="margin-left: auto; margin-right: auto;">My Projects</h1>
                <div class="projects-list">
                    <!-- Project items will be dynamically added here -->
                </div>
            </div>

            <!-- Contact Me section -->
            <div class="content-left" id="contact-section" style="display: none;">
                <h1 class="section-title" style="margin-left: auto; margin-right: auto;">Contact Me</h1>
                <img src="assets/images/logo.webp" alt="Logo" class="contact-logo">
                <p class="contact-intro">Feel free to reach out through any of these channels.</p>
                <div class="social-links">
                    <!-- Social links will be dynamically added here -->
                </div>
            </div>

            <div class="background-overlay"></div>
        </div>

        <!-- Project Modal -->
        <div class="project-modal" id="projectModal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <button class="modal-close" id="modalClose">&times;</button>
                <div class="modal-readme" id="modalReadme"></div>
                <a href="#" class="github-link" id="githubLink" target="_blank">Go to project's github page</a>
            </div>
        </div>

        <!-- Audio Bubble -->
        <div id="audio-bubble">
            <img src="assets/images/bubble.png" alt="Audio" />
        </div>
        <div id="audio-player-popup" class="hidden"></div>

        <audio id="bg-audio" autoplay="true" preload="metadata"></audio>
        <!-- JavaScript -->
        <script type="module" src="index.js"></script>
    </body>
</html>
